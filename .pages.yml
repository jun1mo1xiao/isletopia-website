# =============================================================================
# Pages CMS 配置文件 —— isletopia-website
# 仓库：https://github.com/tobbylowrie/isletopia-website
# 框架：VitePress 2.0-alpha，srcDir 默认为项目根目录
# 文档：https://pagescms.org/docs
# =============================================================================

# -----------------------------------------------------------------------------
# 媒体（图片）上传目录
# VitePress 把项目根的 public/ 作为静态资源根，上传到 public/images/ 的文件
# 在站点中通过 /images/<filename> 访问。
# -----------------------------------------------------------------------------
media:
  - name: images
    label: 图片资源
    input: public/images
    output: /images
    extensions: [jpg, jpeg, png, webp, gif, svg]

# -----------------------------------------------------------------------------
# 内容集合
# -----------------------------------------------------------------------------
content:

  # ===========================================================================
  # 一、Feed 类文章（4 类，共用同一套 frontmatter 模板）
  # 这些目录的文章会被 NewsFeed.vue 聚合到 /update 动态页
  # ===========================================================================

  # 1. 博客
  - name: blogs
    label: 博客
    type: collection
    path: blogs
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, hide]
      primary: title
      sort: date
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: date, label: 发布日期, type: date, required: true }
      - { name: description, label: 摘要描述, type: text }
      - name: tags
        label: 标签
        type: string
        list: true
      - name: author
        label: 作者
        type: string
        list: true
        default: [梦幻之屿管理组]
      - { name: category, label: 分类, type: string, default: blogs, hidden: true }
      - { name: layout, label: 布局, type: string, default: doc, hidden: true }
      - { name: sidebar, label: 显示侧边栏, type: boolean, default: false, hidden: true }
      - { name: hide, label: 在动态页隐藏, type: boolean, default: false }
      - { name: aliases, label: 别名, type: string, list: true, hidden: true }
      - { name: body, label: 正文, type: rich-text }

  # 2. 活动公告
  - name: events
    label: 活动
    type: collection
    path: events
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, hide]
      primary: title
      sort: date
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: date, label: 发布日期, type: date, required: true }
      - { name: description, label: 摘要描述, type: text }
      - name: tags
        label: 标签
        type: string
        list: true
      - name: author
        label: 作者
        type: string
        list: true
        default: [梦幻之屿管理组]
      # 活动信息（站点由 EventInfoTable.vue 渲染成表格）；留空的子字段不会出现在页面上
      - name: event
        label: 活动信息
        type: object
        fields:
          - name: type
            label: 活动类型
            type: select
            options:
              values: [宣传类, 创作类, 评分类]
          - name: deadline
            label: 截止日期（YYYY-MM-DD 或 长期）
            type: string
          - { name: platform, label: 活动平台, type: string }
          - { name: link, label: 参与链接, type: string }
          - name: rewards
            label: 活动奖励
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{item}（{count}）"
            fields:
              - { name: item, label: 物品名称, type: string, required: true }
              - { name: count, label: 数量（留空默认 1）, type: string }
          - { name: limit, label: 参与限制, type: text }
          - name: contact
            label: 负责管理员
            type: string
            list: true
      - { name: category, label: 分类, type: string, default: events, hidden: true }
      - { name: layout, label: 布局, type: string, default: doc, hidden: true }
      - { name: hide, label: 在动态页隐藏, type: boolean, default: false }
      - { name: aliases, label: 别名, type: string, list: true, hidden: true }
      - { name: body, label: 正文, type: rich-text }

  # 3. 更新日志（按日期命名文件）
  - name: changelog
    label: 更新日志
    type: collection
    path: changelog
    filename:
      template: "{year}-{month}-{day}.md"
      field: create
    format: yaml-frontmatter
    view:
      fields: [title, date]
      primary: title
      sort: date
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: date, label: 发布日期, type: date, required: true }
      - { name: description, label: 摘要描述, type: text }
      - name: tags
        label: 标签
        type: string
        list: true
      - name: author
        label: 作者
        type: string
        list: true
        default: [梦幻之屿管理组]
      - { name: category, label: 分类, type: string, default: changelog, hidden: true }
      - { name: layout, label: 布局, type: string, default: doc, hidden: true }
      - { name: sidebar, label: 显示侧边栏, type: boolean, default: false, hidden: true }
      - { name: hide, label: 在动态页隐藏, type: boolean, default: false }
      - { name: aliases, label: 别名, type: string, list: true, hidden: true }
      - { name: body, label: 正文, type: rich-text }

  # 4. 公告
  - name: notices
    label: 公告
    type: collection
    path: notices
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, hide]
      primary: title
      sort: date
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: date, label: 发布日期, type: date, required: true }
      - { name: description, label: 摘要描述, type: text }
      - name: tags
        label: 标签
        type: string
        list: true
      - name: author
        label: 作者
        type: string
        list: true
        default: [梦幻之屿管理组]
      - { name: category, label: 分类, type: string, default: notices, hidden: true }
      - { name: layout, label: 布局, type: string, default: doc, hidden: true }
      - { name: sidebar, label: 显示侧边栏, type: boolean, default: false, hidden: true }
      - { name: hide, label: 在动态页隐藏, type: boolean, default: false }
      - { name: aliases, label: 别名, type: string, list: true, hidden: true }
      - { name: body, label: 正文, type: rich-text }

