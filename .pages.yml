  # 14. 管理组成员（staff/*.md，StaffCarousel.vue 轮播展示，嵌入于 about.md）
  # skin 为成员 Minecraft 皮肤 PNG（64x64 或 64x32），经 CMS 上传到 public/skin/staff/
  # 后自动写入 /skin/staff/<文件名>；未上传或加载失败时组件显示「皮肤待上传」占位提示
  # 动作配置统一收在 animation 下，分 entrance（入场）与 idle（待机）两个子对象：
  # 切到该成员（或双击形象）先播 entrance 入场动作，播完一整段后平滑混合到
  # idle 待机动作并一直保持。入场没有「播放时长」可填 —— 它必须是一次性的，
  # 要长要短取决于动画文件本身一圈多长（也可用 entrance.speed 调整）。
  # 入场到待机的过渡时长是站点级参数，全体成员统一，改
  # .vitepress/theme/config/staffCarousel.ts 的 ENTRANCE_BLEND_SECONDS（秒，0 为瞬间切换）。
  # entrance.speed 与 idle.speed 各自独立，互不影响；留空即默认值。
  # 动作名对应项目根 animations/<动作名>.animation.json —— Blockbench「导出动画」得到的
  # Bedrock 动画格式，这批初始文件由 scripts/bake-animations.mjs 从原先的 skinview3d
  # 内置动作转换而来。加新动作：文件丢进 animations/，再在下拉里加一条同名选项即可。
  # 文件里能认的骨骼名：head、body、right_arm、left_arm、right_leg、left_leg、cape、
  # left_elytra、right_elytra，以及 root（整身的位移与倾倒）。
  # 文件写着 loop: true 的动作也能当入场用：只播一圈就收，不会转个不停。
  - name: staff
    label: 管理组成员
    type: collection
    path: staff
    # {primary} 由 Pages CMS 用 slugify(值, { lower: true, strict: true }) 生成，
    # strict 只保留 A-Za-z0-9：中文成员名会被清成空串，文件名退化成 ".md"。
    # 服务端把 ".md" 按 dotfile 处理、判定扩展名为空，与集合要求的 md 不符，
    # 于是保存时报 Invalid extension "" for content "staff"。
    # 双保险：name 字段用 pattern 限定 ASCII（正常路径），
    # field: create 让创建时文件名可直接手改（需要中文名等特殊情况的退路）。
    filename:
      template: "{primary}.md"
      field: create
    format: yaml-frontmatter
    view:
      fields: [name, role]
      primary: name
      sort: name
    fields:
      - name: name
        label: 成员名称（游戏 ID，同时用作文件名）
        type: string
        required: true
        pattern:
          regex: "^[A-Za-z0-9_-]{1,32}$"
          message: 成员名称只能使用字母、数字、下划线或短横线，它会直接成为 staff/ 下的文件名；填中文会保存失败
      - { name: role, label: 职务, type: string, required: true }
      - { name: bio, label: 一段话简介（单段文字）, type: text, required: true }
      - { name: weight, label: 排序权重（越小越靠前，默认 0）, type: number }
      - name: animation
        label: 动作
        type: object
        fields:
          - name: entrance
            label: 入场动作（切到该成员时播一整段，之后转入待机动作）
            type: object
            fields:
              - name: name
                label: 动作
                type: select
                default: none
                options:
                  values:
                    - { name: none, label: 无（一直显示待机动作） }
                    - { name: walk, label: 走路 }
                    - { name: run, label: 跑步 }
                    - { name: fly, label: 飞翔 }
                    - { name: wave_left, label: 挥手（左手） }
                    - { name: wave_right, label: 挥手（右手） }
                    - { name: crouch, label: 潜行（蹲下） }
                    - { name: hit, label: 攻击（挥击） }
                    - { name: swim, label: 游泳 }
                    - { name: idle, label: 待机（轻微呼吸摆动） }
              - name: speed
                label: 播放速度（0.01~10 之间任意数，1 为原速，越小越慢；入场动作要播完一整段，不能填 0）
                type: number
                default: 1
                options:
                  min: 0.01
                  max: 10
                  # 不写 step 时浏览器按「步长 1」校验，而步长是从 min 起算的：
                  # min 0.01 就只认 1.01、2.01……填 0.7、1.5 会被判为非法。
                  # any 表示不设步长，允许任意小数。
                  step: "any"
          - name: idle
            label: 待机动作（入场动作播完后一直保持）
            type: object
            fields:
              - name: name
                label: 动作
                type: select
                default: idle
                options:
                  values:
                    - { name: idle, label: 待机（轻微呼吸摆动） }
                    - { name: walk, label: 走路 }
                    - { name: run, label: 跑步 }
                    - { name: fly, label: 飞翔 }
                    - { name: wave_left, label: 挥手（左手） }
                    - { name: wave_right, label: 挥手（右手） }
                    - { name: crouch, label: 潜行（蹲下） }
                    - { name: hit, label: 攻击（挥击） }
                    - { name: swim, label: 游泳 }
              - name: speed
                label: 播放速度（0~10 之间任意数，1 为原速，越小越慢；填 0 定格在起始姿势）
                type: number
                default: 0.7
                options:
                  min: 0
                  max: 10
                  # 同 entrance.speed：步长默认 1 且从 min 起算，不写 step 就填不进 0.7 这类小数
                  step: "any"
      - name: skin
        label: 皮肤 PNG
        type: image
        options:
          media: skins

# -----------------------------------------------------------------------------
# 按钮动作（actions）
# Pages CMS 的 action 只做一件事：对指定的 GitHub Actions 工作流发一次
# workflow_dispatch。按钮出现在仓库左侧的 Actions 页，点了才构建一次，
# 因此无需给站点开「每次提交自动构建」——main 上频繁的 CMS 保存不触发构建。
# 调度时 CMS 固定传一个名为 payload 的输入（JSON，含触发者与所在条目信息），
# 所以对应工作流必须声明 inputs.payload，否则 GitHub 会以 422 拒绝。
#   name/label  动作标识（字母数字与 - _）与按钮文字
#   workflow    工作流文件名，写在哪个 ref 上由 ref 决定
#   ref         在哪个分支跑该工作流；省略即 CMS 当前分支
#   scope       按钮位置：collection / entry；省略则出现在全局 Actions 页
#   confirm     点击前的二次确认框（发布这类动作务必加）
#   cancelable  是否允许取消运行，默认 true
# 前置条件：.github/workflows/ 下对应的工作流必须已存在于 ref 指定的分支上
# （本仓库即 main），按钮才会出现在 Actions 页。
# 两个按钮还需各配一次 secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_PREVIEW_HOOK  Cloudflare 项目 → 设置 → 构建 → 添加 Deploy Hook，
#                            Branch to build 填 main，把生成的 URL 存进来。
#                            供「Cloudflare 预览 main」使用，无需 API 令牌。
#   DEPLOY_TOKEN             供「发布到线上」使用：deploy 分支开了
#                            「Require a pull request before merging」，默认令牌的
#                            github-actions[bot] 身份不是管理员、推送会被拒，需要一个
#                            属主本人的 fine-grained PAT（限定本仓库，
#                            权限只给 Contents: Read and write）。
# -----------------------------------------------------------------------------
actions:
  # 日常最常用：改完内容先构建一次 main 看效果，只出预览地址，不碰线上
  - name: cf-preview
    label: 在CF-Pages上预览
    workflow: preview.yml
    ref: main
    confirm:
      title: 确认在 Cloudflare 执行 main 分支构建 （预览分支）
      message: 请务必确认所有在 pagecms 上的修改都已经保存成功。执行后，通过 https://main.isletopia-website.pages.dev/ 查看预览效果。
      button: 确认并执行
  - name: cloudflare-publish
    label: 发布到CF-Pages(主要)
    workflow: publish.yml
    ref: main
    confirm:
      title: 确认在 Cloudflare Pages 执行 deploy 分支构建 （线上分支）
      message: 请务必确认所有在 pagecms 上的修改都已经保存成功，并且已经通过 “发布到 CF-Pages（预览）” 进行网站预览，确保没有BUG。执行后，将 deploy 分支快进到 main 的最新提交，Cloudflare Pages 随即构建一次。若 deploy 含有 main 之外的提交则拒绝执行。线上地址为： https://menghuanzhiyu.com/ 。
      button: 发布
  - name: github-publish
    label: 发布到GH-Pages(备用)
    workflow: pages.yml
    ref: main
    confirm:
      title: 确认在 GitHub Pages 执行 deploy 分支构建 （备用线上分支）
      message: 请务必确认所有在 pagecms 上的修改都已经保存成功，并且已经通过 “发布到 CF-Pages（预览）” 进行网站预览，确保没有BUG。执行后，将从 deploy 分支构建并部署到 https://tobbylowrie.github.io/isletopia-website/ 。注意本按钮取的是 deploy 分支，需先执行 “发布到 CF-Pages (线上)” 才会包含 main 的最新内容。
      button: 发布

# -----------------------------------------------------------------------------
# 全局设置
# -----------------------------------------------------------------------------
settings:
  # merge: true —— 编辑时保留 schema 中未声明的 frontmatter 字段
  # 这对避免覆盖手动添加的 frontmatter 字段非常重要
  content:
    merge: true
  # commit: 用编辑者的 GitHub 身份提交，便于追溯
  #
  # 发布策略（deploy 分支模式）：
  #   main 为日常集成分支，所有人的提交（含 CMS）都正常进入 main，不做任何
  #   分支保护；Cloudflare Pages 的生产分支指向 deploy，只有把 main 合并到
  #   deploy 并推送时站点才会发布。CMS 若需要隔离的草稿区，也可单独开分支
  #   编辑，定稿后再合回 main。
  commit:
    identity: user
    templates:
      create: "feat(cms): 新建 {path}"
      update: "update(cms): 更新 {path}"
      delete: "chore(cms): 删除 {path}"
      rename: "chore(cms): 重命名 {oldPath} -> {newPath}"
