  # 9. 首页（根目录 index.md）
  # body 是五屏 Vue 组件模板，隐藏以避免 CMS 富文本编辑器破坏组件标签；
  # intro / features / steps 三屏内容由 HomeIntro / HomeFeatures / HomeSteps 经 useData() 读取
  - name: home
    label: 首页
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: 页面标题, type: string, hidden: true }
      - { name: layout, label: 布局, type: string, default: page, hidden: true }
      - { name: sidebar, label: 显示侧边栏, type: boolean, default: false, hidden: true }
      - { name: isHome, label: 是否为首页, type: boolean, default: true, hidden: true }
      # 第二屏：欢迎介绍（HomeIntro.vue）
      - name: intro
