# 一键预览：让 Cloudflare Pages 构建一次 main 分支，只出预览地址，不动线上。
#
# 为什么用 Deploy Hook 而不是 Pages API：
#   Cloudflare 的 Deploy Hook 在创建时就能指定「Branch to build」，本工作流要用的
#   那条请填 main。由于项目的生产分支是 deploy，构建 main 得到的是预览部署，
#   不会影响线上；预览地址固定用分支别名 https://main.isletopia-website.pages.dev/ 。
#   API 方案要额外提供 account id、项目名和 Pages: Edit 令牌，Hook 只要一个 URL。
#
# 前置配置（一次）：
#   Cloudflare 控制台 → Workers 与 Pages → 本项目 → 设置 → 构建 → 添加 Deploy Hook，
#   Branch to build 填 main，保存后复制生成的 URL，
#   存为本仓库的 Actions secret：CLOUDFLARE_PREVIEW_HOOK。
#   Hook URL 本身不带鉴权、拿到就能触发构建，因此只放在 secret 里，不写进代码。
name: Preview

on:
  workflow_dispatch:
    inputs:
      # Pages CMS 调度工作流时固定只传一个名为 payload 的输入（JSON 字符串，
      # 含触发者与所在条目信息）。不声明会被 GitHub 以 422 拒收。
      payload:
        description: Pages CMS 传入的触发上下文（JSON），仅用于日志
        required: false
        type: string
        default: ""

# 只是向 Hook 发一次 POST，不需要读写仓库内容
permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Cloudflare Pages 构建 main（预览）
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_PREVIEW_HOOK }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail

          if [ -n "$PAYLOAD" ]; then
            echo "▸ 触发者：$(echo "$PAYLOAD" | jq -r '.triggeredBy.githubUsername // .triggeredBy.name // "unknown"')"
          else
            echo "▸ 手动触发（gh workflow run 或 Actions 页面）"
          fi

          if [ -z "$HOOK_URL" ]; then
            echo "✗ 缺少 Actions secret CLOUDFLARE_PREVIEW_HOOK。"
            echo "  在 Cloudflare 控制台的项目 → 设置 → 构建 → 添加 Deploy Hook，"
            echo "  Branch to build 填 main，把生成的 URL 存为仓库 secret 后重试。"
            exit 1
          fi

          # Hook 只接受 POST，返回 2xx 表示已排入构建
          status=$(curl -sS -o /tmp/hook-body.txt -w '%{http_code}' -X POST "$HOOK_URL")
          body=$(cat /tmp/hook-body.txt)
          [ -n "$body" ] && echo "▸ Cloudflare 返回：$body"

          if [ "${status:0:1}" != "2" ]; then
            echo "✗ 触发失败，HTTP $status。URL 失效或项目改动过 Hook 时会出现这个错误，"
            echo "  重新生成一条 Deploy Hook 并更新 secret 即可。"
            exit 1
          fi

          {
            echo "已排入构建：Cloudflare Pages 正在构建 main 分支。"
            echo "构建完成后访问 https://main.isletopia-website.pages.dev/ 查看预览（分支别名地址，始终指向 main 的最近一次构建）。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ 已触发，预览地址 https://main.isletopia-website.pages.dev/"
